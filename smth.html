<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Likert Scale</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    .label {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #999;
    }

    .scale {
      display: flex;
      height: 80px;
      cursor: pointer;
      gap: 3px; /* spacing between segments */
    }

    .segment {
      flex: 1;
      background: #E0E0E0;
      transition: all 0.3s ease;
      border-radius: 0;
    }

    .segment:first-child {
      border-radius: 40px 0 0 40px;
    }

    .segment:last-child {
      border-radius: 0 40px 40px 0;
    }

    .segment:hover {
      opacity: 0.7;
    }


    /* Color classes */
    .segment.pos-1 { background: #E85D5D; }
    .segment.pos-2 { background: #F5A623; }
    .segment.pos-3 { background: #F8D347; }
    .segment.pos-4 { background: #7ED321; }
    .segment.pos-5 { background: #4CAF50; }

    .selected-text {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
      color: #666;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">Select your response</div>
    <div class="scale">
      <div class="segment" data-value="1"></div>
      <div class="segment" data-value="2"></div>
      <div class="segment" data-value="3"></div>
      <div class="segment" data-value="4"></div>
      <div class="segment" data-value="5"></div>
    </div>
    <div class="selected-text" id="text"></div>
  </div>

  <script>
    const segments = document.querySelectorAll('.segment');
    const textElement = document.getElementById('text');
    const labels = [
      'Strongly Disagree',
      'Disagree',
      'Neither agree nor Disagree',
      'Agree',
      'Strongly Agree'
    ];

    segments.forEach((segment) => {
      segment.addEventListener('click', () => {
        const value = parseInt(segment.dataset.value);

        // Reset all segments
        segments.forEach((seg) => {
          seg.classList.remove('pos-1', 'pos-2', 'pos-3', 'pos-4', 'pos-5', 'selected');
        });

        // Color all segments up to the clicked one
        segments.forEach((seg, i) => {
          if (i < value) {
            seg.classList.add(`pos-${i + 1}`);
          }
        });

        // Mark clicked segment as selected
        segment.classList.add('selected');

        // Update label text
        textElement.textContent = labels[value - 1];
      });
    });
  </script>
</body>
</html>
